# remove lag when pressing escape key
set -sg escape-time 0

set -g base-index 1
set -g history-limit 100000
set -s set-clipboard on
set -g renumber-windows on
set -g focus-events on

# ---------------------------------------------------------------------------
# Terminal definition (must come BEFORE mouse/feature lines so the terminfo
# entry advertises the capabilities tmux probes when it enables mouse mode).
#
# tmux-256color is the modern, correct entry for tmux >=2.1: it advertises
# focus events, italics, OSC52 clipboard, AND the xterm-style mouse modes
# (XT/XM) that tmux requires for SGR-1006 mouse reporting (wheel scroll,
# click-to-select, border-drag resize, etc). The legacy screen-256color
# entry omits XT, which silently breaks mouse reporting on some hosts
# (this was our scroll/click bug). Fall back to screen-256color only when
# tmux-256color is missing from the host's terminfo db.
# ---------------------------------------------------------------------------
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'

# Declare extra capabilities of the *outer* terminal. terminal-features is
# the modern (tmux >=3.2) way; terminal-overrides is the legacy fallback.
# Format: "<term-glob>:<feat>:<feat>:..."  (colons separate features)
#   RGB        - 24-bit truecolor (replaces the old Tc flag)
#   usstyle    - colored/styled underlines
#   hyperlinks - OSC 8 hyperlinks
set -as terminal-features "*-256color:RGB:usstyle:hyperlinks"
set -as terminal-features "xterm*:RGB:usstyle:hyperlinks"

# Legacy override for older tmux/terminfo combos. XT explicitly tells tmux
# the host terminal understands xterm extensions (incl. SGR mouse modes).
# Reset first so repeated `source-file` reloads don't pile up duplicates.
set -g  terminal-overrides ""
set -ga terminal-overrides "*-256color*:Tc"
set -ga terminal-overrides "xterm*:XT"

# ---------------------------------------------------------------------------
# Mouse support
#   - Wheel scroll up      -> enters copy-mode and scrolls history
#   - Click on a pane      -> selects that pane (MouseDown1Pane)
#   - Drag on a pane border-> resizes panes (MouseDrag1Border, default binding)
#   - Drag inside a pane   -> begins selection / enters copy-mode
# All of the above rely on the terminfo block above being correct.
# ---------------------------------------------------------------------------
set -g mouse on

# ---------------------------------------------------------------------------
# Prefix key: Ctrl+Space (replaces the default Ctrl+b)
#   - Thumb on Space, pinky on Ctrl -> symmetric, low-strain.
#   - No conflict with shell readline Ctrl+a (beginning-of-line) or Ctrl+e.
#   - To send a literal Ctrl+Space to an inner program, press prefix twice.
#
# macOS NOTE: System Settings -> Keyboard -> Keyboard Shortcuts ->
#   Input Sources: uncheck "Select the previous input source" (Ctrl+Space)
#   and "Select next source in Input menu" (Ctrl+Opt+Space) so the OS
#   stops swallowing the keystroke before tmux ever sees it.
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g default-shell /bin/zsh

# vi copy-paste mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# select pane
#unbind Up
#unbind Right
bind j select-pane -D
bind k select-pane -U
bind h select-pane -L
bind l select-pane -R

# resize pane
#unbind C-Up
#unbind C-Down
#unbind C-Left
#unbind C-Right
#bind -r J resize-pane -D
#bind -r K resize-pane -U
#bind -r H resize-pane -L
#bind -r L resize-pane -R

# reload tmux conf (prefix + r). NOTE: prefix + Ctrl+r is reserved for
# tmux-resurrect's restore-session binding; do not bind reload there.
bind r source-file ~/.tmux.conf \; display "Reloaded .tmux.conf"


# better split bindings
unbind %
unbind '"'
bind-key \\ split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Colors and styling
source-file ~/.tmux-molokai.conf
set -g status "on"

# Show pane index + worktree name + program title in the border.
# Worktree name resolution (both are per-pane, unlike #(...) which tmux
# evaluates once globally for the active pane -- that was the all-panes-show-
# the-same-thing bug):
#   1. @worktree  - pane-scoped option set by a zsh hook on cd (true worktree
#                   root name; see ~/.zsh/rc.d/tmux-worktree). Only present in
#                   panes running an interactive zsh.
#   2. b:pane_current_path - basename of the pane's cwd. Pure tmux, always
#                   available, so it covers panes running claude or sbx (which
#                   you launch from the worktree dir, so its cwd basename is
#                   the worktree name even inside the container).
# #{pane_title} is appended so program-set titles (e.g. claude's work summary)
# still show. prefix + . still renames the pane title manually.
set -g pane-border-status top
set -g pane-border-format " #P: #{?@worktree,#{@worktree},#{b:pane_current_path}} | #{pane_title} "
bind-key . command-prompt -p "Pane title:" "select-pane -T '%%'"

# Active pane: pure black. Inactive panes: fallback shade.
set -wg window-active-style 'bg=#000000'
set -wg window-style 'bg=#1c1c1c'

# Assign a unique tinted background to each new pane based on its index.
set-hook -g after-split-window "run-shell 'sh ~/.tmux-pane-bg.sh'"

# ===========================================================================
# tpm (Tmux Plugin Manager) and plugins
#
# First-time install on a new machine:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# After editing the plugin list below, fetch new plugins with either:
#   prefix + I    (inside tmux)
#   ~/.tmux/plugins/tpm/bin/install_plugins    (from shell)
# ===========================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore tmux sessions (prefix + Ctrl-s / Ctrl-r)
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save every 15min, auto-restore on tmux start
set -g @plugin 'abhinav/tmux-fastcopy'         # leader-key text picker (prefix + F). NOTE: also requires
                                               # the `tmux-fastcopy` binary on PATH:
                                               #   brew install tmux-fastcopy
                                               # (or `go install github.com/abhinav/tmux-fastcopy@latest`)

# Continuum: auto-restore the last saved environment when tmux starts.
set -g @continuum-restore 'on'

# tmux-fastcopy: action to take with the picked text. `load-buffer -w` copies
# to both the tmux buffer and the system clipboard via OSC52.
set -g @fastcopy-action 'tmux load-buffer -w -'
# Custom regex patterns (in addition to the plugin's built-in URL/path/hash patterns).
set -g @fastcopy-regex-phab-diff '\bD\d{3,}\b'
set -g @fastcopy-regex-bazel-label '/(?:/[\w\.\-]+){3,}(?::[\w\-]+)\b'

# Initialize tpm. MUST be the very last line of tmux.conf.
run '~/.tmux/plugins/tpm/tpm'